<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="100%" height="100%">
  <!-- MGM University Dignified Convocation Student Photo Placeholder -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F4ECE1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C99545" />
      <stop offset="50%" stop-color="#E4C58F" />
      <stop offset="100%" stop-color="#C99545" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#756B63" />
      <stop offset="100%" stop-color="#5A321F" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="300" rx="8" fill="url(#bgGrad)" />

  <!-- Outer Ceremonial Gold Border -->
  <rect x="6" y="6" width="228" height="288" rx="6" fill="none" stroke="url(#frameGrad)" stroke-width="2" />
  <!-- Inner Delicate Framing Line -->
  <rect x="10" y="10" width="220" height="280" rx="4" fill="none" stroke="#E4D8C8" stroke-width="1" stroke-dasharray="4,2" />

  <!-- Corner Flourish Accents -->
  <path d="M 12 20 L 20 12" stroke="#C99545" stroke-width="1.5" />
  <path d="M 228 20 L 220 12" stroke="#C99545" stroke-width="1.5" />
  <path d="M 12 280 L 20 288" stroke="#C99545" stroke-width="1.5" />
  <path d="M 228 280 L 220 288" stroke="#C99545" stroke-width="1.5" />

  <!-- Institution Header Inscription -->
  <text x="120" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#5A321F" letter-spacing="2">MGM UNIVERSITY</text>
  <line x1="60" y1="38" x2="180" y2="38" stroke="#C99545" stroke-width="0.75" />

  <!-- Academic Graduate Silhouette with Mortarboard Cap -->
  <g transform="translate(120, 130)">
    <!-- Mortarboard Diamond Cap -->
    <polygon points="0,-72 46,-56 0,-40 -46,-56" fill="#3F2418" />
    <!-- Cap Skull Skullcap -->
    <path d="M -22 -50 C -22 -35, 22 -35, 22 -50 Z" fill="#5A321F" />
    <!-- Tassel Button & Ribbon -->
    <circle cx="0" cy="-56" r="2.5" fill="#C99545" />
    <path d="M 0 -56 C 14 -54, 28 -42, 34 -30" fill="none" stroke="#C99545" stroke-width="1.5" />
    <circle cx="34" cy="-28" r="2" fill="#C99545" />

    <!-- Graduate Head Profile -->
    <ellipse cx="0" cy="-20" rx="26" ry="30" fill="url(#silhouetteGrad)" />

    <!-- Academic Robe / Gown Shoulders -->
    <path d="M -68 85 C -68 20, -32 5, 0 5 C 32 5, 68 20, 68 85 Z" fill="url(#silhouetteGrad)" />
    <!-- Robe Ceremonial Stole / Lapels in Gold -->
    <path d="M -16 6 L -6 45 L -18 85 L -34 85 L -26 40 Z" fill="#C99545" opacity="0.9" />
    <path d="M 16 6 L 6 45 L 18 85 L 34 85 L 26 40 Z" fill="#C99545" opacity="0.9" />
    <!-- Stole Ribbon Neck V -->
    <polygon points="0,22 -12,6 12,6" fill="#FAF6F0" />
  </g>

  <!-- Bottom Inscription -->
  <line x1="50" y1="248" x2="190" y2="248" stroke="#C99545" stroke-width="0.75" />
  <text x="120" y="266" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#756B63" letter-spacing="2">PHOTO UNAVAILABLE</text>
  <text x="120" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" font-style="italic" fill="#8C5338" letter-spacing="1">Convocation 2026</text>
</svg>
