<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="100%" height="100%">
  <!-- MGM University Official Institutional Emblem & Wordmark Placeholder Asset -->
  <defs>
    <radialGradient id="sunburstGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4C58F" />
      <stop offset="65%" stop-color="#C99545" />
      <stop offset="100%" stop-color="#8C5338" />
    </radialGradient>
  </defs>

  <!-- Sunburst / Rays Emblem on Left -->
  <g transform="translate(50, 50)">
    <!-- Central Solar Disc -->
    <circle cx="0" cy="0" r="14" fill="url(#sunburstGrad)" />
    <circle cx="0" cy="0" r="10" fill="#5A321F" />
    <circle cx="0" cy="0" r="5" fill="#FAF6F0" />

    <!-- Radiating Sunburst Rays -->
    <!-- Cardinal & Diagonal Primary Rays -->
    <path d="M 0 -16 L 3 -38 L 0 -44 L -3 -38 Z" fill="#C99545" />
    <path d="M 0 16 L 3 38 L 0 44 L -3 38 Z" fill="#C99545" />
    <path d="M -16 0 L -38 -3 L -44 0 L -38 3 Z" fill="#C99545" />
    <path d="M 16 0 L 38 -3 L 44 0 L 38 3 Z" fill="#C99545" />

    <path d="M 11 11 L 28 25 L 32 32 L 25 28 Z" fill="#C99545" />
    <path d="M -11 -11 L -28 -25 L -32 -32 L -25 -28 Z" fill="#C99545" />
    <path d="M 11 -11 L 28 -25 L 32 -32 L 25 -28 Z" fill="#C99545" />
    <path d="M -11 11 L -28 25 L -32 32 L -25 28 Z" fill="#C99545" />

    <!-- Intermediate Finer Rays -->
    <line x1="0" y1="-16" x2="0" y2="-32" stroke="#5A321F" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="16" x2="0" y2="32" stroke="#5A321F" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="0" x2="-32" y2="0" stroke="#5A321F" stroke-width="2" stroke-linecap="round" />
    <line x1="16" y1="0" x2="32" y2="0" stroke="#5A321F" stroke-width="2" stroke-linecap="round" />
    
    <line x1="9" y1="-13" x2="20" y2="-27" stroke="#5A321F" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-9" y1="-13" x2="-20" y2="-27" stroke="#5A321F" stroke-width="1.8" stroke-linecap="round" />
    <line x1="9" y1="13" x2="20" y2="27" stroke="#5A321F" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-9" y1="13" x2="-20" y2="27" stroke="#5A321F" stroke-width="1.8" stroke-linecap="round" />

    <line x1="13" y1="-9" x2="27" y2="-20" stroke="#C99545" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-13" y1="-9" x2="-27" y2="-20" stroke="#C99545" stroke-width="1.8" stroke-linecap="round" />
    <line x1="13" y1="9" x2="27" y2="20" stroke="#C99545" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-13" y1="9" x2="-27" y2="20" stroke="#C99545" stroke-width="1.8" stroke-linecap="round" />

    <!-- Human Figures in Aspiration Silhouette Motif -->
    <!-- Top Aspirant -->
    <circle cx="0" cy="-22" r="2.5" fill="#5A321F" />
    <path d="M -5 -15 Q 0 -19 5 -15 L 3 -10 L -3 -10 Z" fill="#5A321F" />
    <!-- Bottom Aspirant -->
    <circle cx="0" cy="22" r="2.5" fill="#5A321F" />
    <path d="M -5 15 Q 0 19 5 15 L 3 10 L -3 10 Z" fill="#5A321F" />
    <!-- Left Aspirant -->
    <circle cx="-22" cy="0" r="2.5" fill="#5A321F" />
    <!-- Right Aspirant -->
    <circle cx="22" cy="0" r="2.5" fill="#5A321F" />
  </g>

  <!-- Typography Block on Right -->
  <g fill="#5A321F" transform="translate(112, 0)">
    <!-- Primary MGM UNIVERSITY title in formal serif caps -->
    <text x="0" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" letter-spacing="2">MGM UNIVERSITY</text>
    <!-- Subtitle: Chhatrapati Sambhajinagar -->
    <text x="2" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#756B63" letter-spacing="3.5">CHHATRAPATI SAMBHAJINAGAR</text>
    <!-- Convocation Ceremony Label in Ceremonial Gold -->
    <text x="2" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#C99545" letter-spacing="1">Convocation Management System</text>
  </g>
</svg>
