<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGM University Convocation Slide Template</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Montserrat & Inter for typography matching official design -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            montserrat: ['Montserrat', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            convocationBrown: '#2e1d17',
            convocationRed: '#b7282b',
          }
        }
      }
    }
  </script>

  <style>
    /* Full viewport display container locked to standard 16:9 screen ratio */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    .screen-stage {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 1920px;
      max-height: 100vh;
      background: #faf8f5;
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    /* Radiating sunburst effect centered behind the portrait */
    .sunburst-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(215, 175, 95, 0.08) 0deg 3.5deg,
        transparent 3.5deg 7deg
      );
      mask-image: radial-gradient(circle at 23% 50%, black 15%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle at 23% 50%, black 15%, transparent 72%);
    }

    /* Soft campus garden watermark wash */
    .campus-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 75% 55%, rgba(210, 200, 185, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 25% 45%, rgba(255, 255, 255, 0.95) 0%, rgba(247, 243, 237, 0.65) 100%);
    }

    /* Premium Academic Portrait Frame */
    .portrait-frame-outer {
      background: linear-gradient(135deg, #dfaf4d 0%, #faeaaf 28%, #c99332 55%, #fae8a8 78%, #8f5c15 100%);
      box-shadow: 
        0 24px 50px -10px rgba(46, 29, 23, 0.3),
        0 10px 20px -4px rgba(0, 0, 0, 0.12);
    }

    .portrait-frame-mat {
      background: linear-gradient(145deg, #ffffff 0%, #fbf8f2 100%);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.06);
    }

    .portrait-frame-inner {
      background: linear-gradient(135deg, #caa044 0%, #fcedbb 50%, #9e6919 100%);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.14);
    }

    /* Allow live text clicking & editing directly on screen if needed */
    [contenteditable="true"]:focus {
      outline: 2px dashed #d4a13e;
      outline-offset: 4px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <!-- 16:9 Presentation Stage -->
  <main class="screen-stage">

    <!-- Subtle Background Overlays -->
    <div class="campus-overlay"></div>
    <div class="sunburst-bg"></div>

    <!-- ========================================== -->
    <!-- LEFT SECTION: Candidate Portrait in Elegant Frame -->
    <!-- ========================================== -->
    <div class="w-[45%] h-full relative flex items-center justify-center p-8 z-10">
      
      <!-- Portrait Card Container (Standard 4:5 Portrait Ratio) -->
      <div class="relative w-[70%] max-w-[340px] aspect-[4/5] flex items-center justify-center">

        <!-- Outer Metallic Gold Beveled Frame -->
        <div class="w-full h-full rounded-2xl portrait-frame-outer p-[5px] relative">
          
          <!-- Classic Ivory Matting (Passe-Partout) -->
          <div class="w-full h-full rounded-[11px] portrait-frame-mat p-3 flex flex-col">
            
            <!-- Inner Gold Hairline Trim Around Photo -->
            <div class="w-full h-full rounded-lg portrait-frame-inner p-[2px] overflow-hidden flex-1 shadow-sm">
              
              <!-- CANDIDATE PHOTO (Change 'src' to update image) -->
              <div class="w-full h-full rounded-[6px] overflow-hidden bg-slate-200 relative">
                <img 
                  id="candidateImage"
                  src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=700&q=80" 
                  alt="Graduating Student Portrait" 
                  class="w-full h-full object-cover object-top"
                />
              </div>

            </div>

          </div>

          <!-- Subtle Decorative Gold Corner Accents -->
          <div class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-amber-300/80 rounded-tl pointer-events-none"></div>
          <div class="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-amber-300/80 rounded-tr pointer-events-none"></div>
          <div class="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-amber-300/80 rounded-bl pointer-events-none"></div>
          <div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-amber-300/80 rounded-br pointer-events-none"></div>

        </div>

      </div>

    </div>

    <!-- ========================================== -->
    <!-- RIGHT SECTION: Logos & Student Details    -->
    <!-- ========================================== -->
    <div class="w-[55%] h-full flex flex-col justify-between py-12 pr-16 pl-4 z-10 relative">

      <!-- TOP: Dual Logos Header -->
      <div class="flex items-start justify-between w-full relative">
        
        <!-- Logo 1: 5th Convocation Asset -->
        <div class="flex items-center pt-4">
          <img 
            src="Convocation logo.png" 
            alt="5th Convocation Saturday 26th September 2026" 
            class="h-32 w-auto max-w-[340px] object-contain drop-shadow-sm"
          />
        </div>

        <!-- Logo 2: MGM University Charkha Asset -->
        <div class="absolute top-[-10px] right-[-20px] flex items-start justify-end">
          <img 
            src="Charakha Logo 1.png" 
            alt="MGM University Chhatrapati Sambhajinagar" 
            class="h-[180px] w-auto max-w-[380px] object-contain drop-shadow-sm"
          />
        </div>

      </div>

      <!-- MIDDLE: Graduate Name, Batch Year, Faculty -->
      <div class="space-y-4 my-auto pl-2 w-full">
        
        <!-- Candidate Full Name -->
        <div class="flex flex-col">
          <h2 contenteditable="true" class="text-[40px] lg:text-[46px] font-black text-convocationBrown leading-[1.1] tracking-tight m-0">
            Shrishrimal
          </h2>
          <h2 contenteditable="true" class="text-[40px] lg:text-[46px] font-black text-convocationBrown leading-[1.1] tracking-tight m-0 mt-1">
            Bhavana Pradeepkumar
          </h2>
        </div>

        <!-- Batch / Academic Year -->
        <div class="pt-2">
          <p contenteditable="true" class="text-3xl lg:text-[34px] font-extrabold text-convocationBrown tracking-tight m-0">
            2024-2026
          </p>
        </div>

        <!-- Faculty / Department Name (Red Color) -->
        <div class="pt-4 flex flex-col">
          <h3 contenteditable="true" class="text-2xl lg:text-[28px] font-black text-convocationRed tracking-normal leading-[1.15] m-0">
            Faculty of management
          </h3>
          <h3 contenteditable="true" class="text-2xl lg:text-[28px] font-black text-convocationRed tracking-normal leading-[1.15] m-0 mt-1">
            and commerce
          </h3>
        </div>

      </div>

      <!-- BOTTOM: Bottom Accent Line -->
      <div class="h-1 w-24 bg-gradient-to-r from-amber-600/40 to-transparent rounded-full mt-2 ml-2"></div>

    </div>

  </main>

</body>
</html>
