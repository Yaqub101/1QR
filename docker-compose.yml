services:
  db:
    image: postgres:16-alpine
    container_name: convocation_venue_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convocation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convocation_password}
      POSTGRES_DB: ${POSTGRES_DB:-convocation_db}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_password}
    # Replication settings, so this database can feed a hot standby (docker-compose.standby.yml).
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "wal_keep_size=512MB", "-c", "hot_standby=on"]
    ports:
      - "5432:5432"
    volumes:
      - venue_pgdata:/var/lib/postgresql/data
      - ./scripts/primary-init-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-convocation_user} -d $${POSTGRES_DB:-convocation_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: convocation-system:latest
    container_name: convocation_venue_app
    restart: unless-stopped
    environment:
      MODE: ${MODE:-venue}
      VENUE_ID: ${VENUE_ID:-college}
      DATABASE_URL: ${DATABASE_URL:-postgresql://convocation_user:convocation_password@db:5432/convocation_db}
      CENTRAL_URL: ${CENTRAL_URL:-}
      VENUE_API_KEY: ${VENUE_API_KEY:-}
      BACKUP_DIR: /backups
      LATE_CUTOFF: ${LATE_CUTOFF:-}
      EVENT_NAME: ${EVENT_NAME:-Annual Convocation 2026}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # Automatic backups (SYSTEM_SPEC 21): a full dump every 5 minutes to a SECOND device. Point BACKUP_HOST_DIR at that
  # device (a USB drive or a second laptop's share), not at this machine's own disk.
  backup:
    image: convocation-system:latest
    container_name: convocation_venue_backup
    restart: unless-stopped
    command: ["python", "-m", "backend.ha.backup", "run"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://convocation_user:convocation_password@db:5432/convocation_db}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-300}
      BACKUP_KEEP: ${BACKUP_KEEP:-24}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups

volumes:
  venue_pgdata:
