<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.event_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="bar">
  <span class="brand">{{ settings.event_name }}</span>
  {% if principal %}
  <span class="who">
    {{ principal.full_name or principal.username }} &middot; {{ role_label[principal.role] }}
  </span>
  <form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>
  {% endif %}
</header>
<main>
  {% if msg %}<p class="flash ok">{{ msg }}</p>{% endif %}
  {% if error %}<p class="flash bad">{{ error }}</p>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
