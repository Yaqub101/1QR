<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ holding.title }}</title>
  <link rel="stylesheet" href="{{ asset_url('led.css') }}">
</head>
<body class="led">
  <header class="led-logos-header">
    <div class="header-logo-pill">
      <img src="{{ asset_url('img/mgm-logo.png') }}" alt="MGM University" class="header-logo mgm-logo">
    </div>
    <div class="header-logo-pill">
      <img src="{{ asset_url('img/convocation-logo.png') }}" alt="Convocation Logo" class="header-logo convocation-logo">
    </div>
  </header>
  <main id="holding" class="holding">
    <h1 id="holding-title">{{ holding.title }}</h1>
    <p id="holding-text">{{ holding.text }}</p>
  </main>
  <main id="stage" class="stage" hidden>
    <div class="photo-container">
      <img id="photo" alt="" onerror="this.src='/static/placeholder.svg';">
    </div>
    <div class="info">
      <div class="ceremony-tag">CONVOCATION 2026 &bull; CONGRATULATIONS</div>
      <h1 id="name"></h1>
      <p id="award" class="award"></p>
      <p id="programme"></p>
      <p id="school"></p>
    </div>
  </main>
  <script src="{{ asset_url('led.js') }}"></script>
</body>
</html>
