[project]
name = "convocation-system"
version = "0.1.0"
description = "Hybrid offline-first convocation event management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "jinja2>=3.1",
    "segno>=1.6",        # QR code (SYSTEM_SPEC 26)
    "reportlab>=4.0",    # pass PDF
    "pillow>=10.0",      # photo handling for the pass
    "cloudinary>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    # Phase 4 tests: render the pass PDF and decode its QR with libraries other than the ones that draw it
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "zxing-cpp>=2.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]


[tool.setuptools.packages.find]
include = ["backend*"]

